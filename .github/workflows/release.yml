name: Release

# Publishes to npm with provenance through npm trusted publishing (OIDC).
# No npm token is stored in the repository. Runs when a GitHub release is published, or manually.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      # Ubuntu 23.10+ restricts unprivileged user namespaces, which the Chromium sandbox needs.
      - run: if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - run: npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
      - run: node scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
      - name: Skip if this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
  # Container image for the GitLab template and `docker run`: ghcr.io/afkzonagroup/kerbcut:<version>.
  # Built, smoke-tested, pushed with SBOM and provenance, and attested. Release events only (needs a version tag).
  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/afkzonagroup/kerbcut
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json ${version}"; exit 1; fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Kerbcut
            org.opencontainers.image.vendor=MB AFKzona Group
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kerbcut:smoke
      - name: Smoke test the image
        run: |
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges kerbcut:smoke --version
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges kerbcut:smoke --help | grep -q 'Kerbcut by AFKzona Group'
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges kerbcut:smoke scan https://example.com --max-pages 1 --quiet --out-json report.json | grep -q 'pages scanned: 1, with errors: 0'
      - name: Build the arm64 image for a smoke test (emulated)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: kerbcut:smoke-arm64
      - name: Smoke test the arm64 image
        run: docker run --rm --platform linux/arm64 --cap-drop=ALL --security-opt no-new-privileges kerbcut:smoke-arm64 --version
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
